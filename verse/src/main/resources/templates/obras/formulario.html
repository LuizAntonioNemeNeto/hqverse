<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HqVerse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            HqVerse
        </a>

        <a class="btn btn-outline-light btn-sm"
           href="/categorias">
            Categorias
        </a>
        <a class="btn btn-outline-light btn-sm"
           href="/obras">
            Obras
        </a>
    </div>
</nav>

<main class="container py-5">
    <h1 class="text-warning mb-4">
        Cadastrar obra

    </h1>
    <form th:action="@{/obras}"
          method="post" th:object="${obra}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Título</label>

            <input type="text" class="form-control"
                   th:field="*{titulo}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Autor</label>

            <input type="text" class="form-control"
                   th:field="*{autor}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{preco}"
                   required>
        </div>

        <div class="mb-3">

            <label class="form-label">Categoria</label>

            <select name="categoriaId"
                    class="form-select"
                    required>

                <option value="">Selecione uma categoria</option>

                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nome}"
                        th:selected="${obra.categoria != null
                      and obra.categoria.id == categoria.id}">
                </option>

            </select>

        </div>

        <button class="btn btn-warning" type="submit">
            Salvar categoria
        </button>
    </form>
</main>
</body>
</html>
